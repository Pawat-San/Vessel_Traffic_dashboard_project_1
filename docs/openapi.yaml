openapi: 3.0.3
info:
  title: Vessel Schedule  Dashboard API Documentation
  version: 1.0.0
  description: Enterprise-grade RESTful API for port vessel tracking (Airport FIDS style).
servers:
  - url: http://localhost:3000/api
    description: Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      uptime:
                        type: number
                      database:
                        type: string
                      version:
                        type: string
                      timestamp:
                        type: string

  /auth/login:
    post:
      summary: Authenticate user and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login. The user object includes mustChangePassword and passwordExpired flags.
        '401':
          description: Invalid credentials
        '429':
          description: Too many failed attempts (locked out)

  /auth/refresh:
    post:
      summary: Issue new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access token generated
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      summary: Revoke session refresh token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session invalidated

  /terminals:
    get:
      summary: Get list of port terminals
      security:
        - bearerAuth: []
      parameters:
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of terminals
    post:
      summary: Create new terminal (Admin Only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalInput'
      responses:
        '201':
          description: Terminal created

  /terminals/{id}:
    get:
      summary: Get terminal by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Terminal details
    put:
      summary: Update terminal (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalInput'
      responses:
        '200':
          description: Terminal updated
    delete:
      summary: Delete terminal (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Terminal deleted

  /vessels:
    get:
      summary: Get active vessels list with search, filters, pagination
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AT SEA, ANCHOR, BERTH, DEPART]
        - name: terminal_id
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: eta
        - name: sortDir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Paginated list of vessels
    post:
      summary: Create new vessel (Admin/Operator Only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VesselInput'
      responses:
        '201':
          description: Vessel created

  /vessels/summary:
    get:
      summary: Get count of vessels by status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status summaries counts

  /vessels/{id}:
    get:
      summary: Get vessel by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vessel details
    put:
      summary: Update vessel (Admin/Operator Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VesselInput'
      responses:
        '200':
          description: Vessel updated
    delete:
      summary: Delete vessel (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vessel deleted

  /vessels/archive:
    post:
      summary: Manually trigger archiving job (Admin Only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Archive job completed successfully

  /archive:
    get:
      summary: Get archived historic vessel logs
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Historical records list

  /archive/purge:
    post:
      summary: Manually purge old archived logs (Admin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 90
      responses:
        '200':
          description: Records purged

  /users:
    get:
      summary: List user accounts and activity status (Superadmin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive partial match on username or display name
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: role
          in: query
          schema: { type: string, enum: [superadmin, admin, operator, viewer] }
        - name: activityStatus
          in: query
          schema: { type: string, enum: [active-now, active-30d, inactive-30d, never-login] }
      responses:
        '200':
          description: Safe account records without credential hashes
        '403':
          description: Only Superadmin can view Account Management
    post:
      summary: Create an account (Superadmin Only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, display_name, role]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                password:
                  $ref: '#/components/schemas/SecurePassword'
                display_name:
                  type: string
                  maxLength: 100
                role:
                  type: string
                  enum: [superadmin, admin, operator, viewer]
      responses:
        '201':
          description: Account created and forced password change enabled
        '400':
          description: Password policy or request validation failed
        '403':
          description: Only Superadmin can create accounts

  /users/activity-summary:
    get:
      summary: Get all-role user activity summary (Superadmin Only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account and usage metrics overall and by role
        '403':
          description: Only Superadmin can view user activity

  /users/activity-events:
    get:
      summary: List safe user activity event metadata (Superadmin Only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: userId
          in: query
          description: Filter by the actor user ID
          schema: { type: integer, minimum: 1 }
        - name: targetUserId
          in: query
          description: Filter by the affected account user ID
          schema: { type: integer, minimum: 1 }
        - name: role
          in: query
          schema: { type: string, enum: [superadmin, admin, operator, viewer] }
        - name: action
          in: query
          schema: { type: string, maxLength: 120 }
        - name: startDate
          in: query
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated events with readable action labels and separate actor/affected-account metadata; never includes credentials, tokens, headers, or bodies
        '403':
          description: Only Superadmin can view user activity

  /users/me/change-password:
    post:
      summary: Change the authenticated user's password
      description: The new password cannot match any of the user's 5 most recent passwords.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password:
                  type: string
                  description: Required for a voluntary change; optional for a forced or expired-password change.
                new_password:
                  $ref: '#/components/schemas/SecurePassword'
      responses:
        '200':
          description: Password changed; existing refresh token revoked
        '400':
          description: Password policy failed or PASSWORD_RECENTLY_USED
        '401':
          description: Current password is missing or incorrect

  /users/{id}/reset-password:
    post:
      summary: Reset another user's password (Superadmin Only)
      description: The temporary password cannot match the target user's 5 most recent passwords.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  $ref: '#/components/schemas/SecurePassword'
      responses:
        '200':
          description: Password reset; forced change enabled and existing refresh token revoked
        '400':
          description: Password policy failed or PASSWORD_RECENTLY_USED
        '403':
          description: Only Superadmin can reset another user's password

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SecurePassword:
      type: string
      minLength: 8
      maxLength: 100
      pattern: '^(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S{8,100}$'
      writeOnly: true
      description: Must contain a lowercase letter, number, and special character, with no whitespace. It must also differ from the user's 5 most recent passwords.

    TerminalInput:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        name:
          type: string
        group_name:
          type: string
        sort_order:
          type: integer
        is_active:
          type: integer
          enum: [0, 1]

    VesselInput:
      type: object
      required:
        - vessel_name
        - type
        - terminal_id
        - activity
        - status
      properties:
        vessel_name:
          type: string
        voy:
          type: string
          nullable: true
          pattern: '^[0-9]{3}$'
          example: '042'
          description: Optional voyage code. If provided, must be exactly 3 digits.
        type:
          type: string
          enum: [Container, Bulk, Tanker, General, RoRo, LPG, Passenger]
        terminal_id:
          type: integer
        activity:
          type: string
          enum: [L, D, B, DD, LD, LB, DB, LDB, L,D, L,B, D,B, L,D,B]
        eta:
          type: string
        etb:
          type: string
        etd:
          type: string
        atd:
          type: string
        status:
          type: string
          enum: [AT SEA, ANCHOR, BERTH, DEPART]
        next_port:
          type: string
        remark:
          type: string
