<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vessel Schedule  Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  
  <div class="login-card">
    <div class="login-logo">🛳️</div>
    <h2 class="login-title">Vessel Schedule</h2>
    <p class="login-subtitle">Schedule Management</p>
    
    <form class="login-form" id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" placeholder="Enter username" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      
      <button class="btn btn-primary" type="submit" style="margin-top: 1rem; padding: 0.75rem;">
        Authenticate
      </button>
    </form>

  <form class="login-form" id="password-change-form" hidden>
    <h2>Change your password</h2>
    <p>Your password has expired or needs to be changed.</p>
    <label class="form-label" for="login-new-password">New password</label>
    <input class="form-control" id="login-new-password" type="password" autocomplete="new-password" maxlength="100" required>
    <label class="form-label" for="login-confirm-password">Confirm password</label>
    <input class="form-control" id="login-confirm-password" type="password" autocomplete="new-password" maxlength="100" required>
    <ul class="password-checklist">
      <li data-rule="length"><span class="password-rule-icon">○</span> Between 8 and 100 characters</li>
      <li data-rule="lowercase"><span class="password-rule-icon">○</span> A lowercase letter</li>
      <li data-rule="number"><span class="password-rule-icon">○</span> A number</li>
      <li data-rule="special"><span class="password-rule-icon">○</span> A special character</li>
      <li data-rule="noWhitespace"><span class="password-rule-icon">○</span> No whitespace</li>
      <li data-rule="matches"><span class="password-rule-icon">○</span> Passwords match</li>
    </ul>
    <button class="btn btn-primary" id="login-change-submit" type="submit" disabled>Change password</button>
  </form>
  </div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Load client scripts -->
  <script src="/js/formatters.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  
</body>
</html>
